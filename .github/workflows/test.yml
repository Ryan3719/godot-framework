name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        run: |
          set -o pipefail
          godot --headless --editor --quit --path . 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:" godot-import.log

      - name: Run tests
        run: |
          set -o pipefail
          godot --headless --verbose --path . 2>&1 | tee godot-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|instances were leaked|resources still in use" godot-test.log

      - name: Run scene transition test
        run: |
          set -o pipefail
          godot --headless --verbose --path . tests/scene_transition_runner.tscn 2>&1 | tee godot-scene-test.log
          grep -F "[TEST] PASS: scene transition completed" godot-scene-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|instances were leaked|resources still in use" godot-scene-test.log

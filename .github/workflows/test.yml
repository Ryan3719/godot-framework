name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        run: |
          set -o pipefail
          godot --headless --editor --quit --path . 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-import.log

      - name: Run tests
        run: |
          set -o pipefail
          godot --headless --verbose --path . 2>&1 | tee godot-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-test.log

      - name: Run scene transition test
        run: |
          set -o pipefail
          godot --headless --verbose --path . tests/scene_transition_runner.tscn 2>&1 | tee godot-scene-test.log
          grep -F "[TEST] PASS: scene transition completed" godot-scene-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-scene-test.log

      - name: Run content pack mount test
        run: |
          set -o pipefail
          godot --headless --verbose --path . tests/content_pack_runner.tscn 2>&1 | tee godot-content-test.log
          grep -F "[TEST] PASS: content pack mounted" godot-content-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-content-test.log

      - name: Run connectivity adapter test
        run: |
          set -euo pipefail
          ready_file=$(mktemp)
          rm "$ready_file"
          python3 tests/connectivity_test_server.py --ready-file "$ready_file" > connectivity-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for index in $(seq 1 100); do
            if [ -s "$ready_file" ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat connectivity-server.log; exit 1; fi
            sleep 0.05
          done
          test -s "$ready_file"
          http_url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["http_url"])' "$ready_file")
          websocket_url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["websocket_url"])' "$ready_file")
          godot --headless --verbose --path . tests/connectivity_integration_runner.tscn -- --http-url="$http_url" --websocket-url="$websocket_url" 2>&1 | tee godot-connectivity-test.log
          grep -F "[CONNECTIVITY TEST] PASS: real HTTP and WebSocket adapters" godot-connectivity-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-connectivity-test.log

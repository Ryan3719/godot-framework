name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        godot-version: [4.4.1, 4.7.1]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false
          include-templates: true

      - name: Import and parse project
        run: |
          set -o pipefail
          godot --headless --editor --quit --path . 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-import.log

      - name: Run tests
        run: |
          set -o pipefail
          godot --headless --verbose --path . 2>&1 | tee godot-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-test.log

      - name: Validate framework configuration
        run: |
          set -o pipefail
          godot --headless --verbose --path . tests/config_validation_runner.tscn 2>&1 | tee godot-config-test.log
          grep -F "[CONFIG TEST] PASS: framework configuration is valid" godot-config-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-config-test.log

      - name: Run performance smoke test
        run: |
          set -o pipefail
          godot --headless --verbose --path . tests/performance_runner.tscn 2>&1 | tee godot-performance-test.log
          grep -F "[BENCHMARK] PASS: framework performance smoke test" godot-performance-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-performance-test.log

      - name: Run scene transition test
        run: |
          set -o pipefail
          godot --headless --verbose --path . tests/scene_transition_runner.tscn 2>&1 | tee godot-scene-test.log
          grep -F "[TEST] PASS: scene transition completed" godot-scene-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-scene-test.log

      - name: Run content pack mount test
        run: |
          set -o pipefail
          godot --headless --verbose --path . tests/content_pack_runner.tscn 2>&1 | tee godot-content-test.log
          grep -F "[TEST] PASS: content pack mounted" godot-content-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-content-test.log

      - name: Run connectivity adapter test
        run: |
          set -euo pipefail
          ready_file=$(mktemp)
          rm "$ready_file"
          python3 tests/connectivity_test_server.py --ready-file "$ready_file" > connectivity-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for index in $(seq 1 100); do
            if [ -s "$ready_file" ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat connectivity-server.log; exit 1; fi
            sleep 0.05
          done
          test -s "$ready_file"
          http_url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["http_url"])' "$ready_file")
          websocket_url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["websocket_url"])' "$ready_file")
          godot --headless --verbose --path . tests/connectivity_integration_runner.tscn -- --http-url="$http_url" --websocket-url="$websocket_url" 2>&1 | tee godot-connectivity-test.log
          grep -F "[CONNECTIVITY TEST] PASS: real HTTP and WebSocket adapters" godot-connectivity-test.log
          ! grep -E "SCRIPT ERROR|Parse Error|^ERROR:|ObjectDB instances leaked|instances were leaked|resources still in use" godot-connectivity-test.log

      - name: Build and install addon package
        run: |
          set -euo pipefail
          package_dir=$(mktemp -d)
          package_path="$package_dir/godot-framework.zip"
          python3 scripts/package_addon.py --output "$package_path"
          python3 scripts/verify_addon_package.py "$package_path"
          bash tests/verify_addon_package.sh "$package_path" "$(command -v godot)"
          bash tests/verify_reference_consumer.sh "$package_path" "$(command -v godot)"
          bash tests/verify_linux_export.sh "$package_path" "$(command -v godot)"
          cp "$package_path.sha256" "package-sha-${{ runner.os }}-${{ matrix.godot-version }}.txt"

      - name: Build and run Web release export
        run: |
          set -euo pipefail
          package_dir=$(mktemp -d)
          package_path="$package_dir/godot-framework.zip"
          python3 scripts/package_addon.py --output "$package_path"
          python3 scripts/verify_addon_package.py "$package_path"
          python3 tests/verify_web_export.py "$package_path" \
            --godot "$(command -v godot)" \
            --chromedriver "$CHROMEWEBDRIVER/chromedriver"

      - name: Upload addon package checksum
        uses: actions/upload-artifact@v7
        with:
          name: package-sha-${{ runner.os }}-${{ matrix.godot-version }}
          path: package-sha-${{ runner.os }}-${{ matrix.godot-version }}.txt
          if-no-files-found: error
          retention-days: 1

  macos-export:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        godot-version: [4.4.1, 4.7.1]
    name: macOS export (${{ matrix.godot-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false
          include-templates: true

      - name: Build and run macOS release export
        run: |
          set -euo pipefail
          package_dir=$(mktemp -d)
          package_path="$package_dir/godot-framework.zip"
          python3 scripts/package_addon.py --output "$package_path"
          python3 scripts/verify_addon_package.py "$package_path"
          bash tests/verify_macos_export.sh "$package_path" "$(command -v godot)"
          cp "$package_path.sha256" "package-sha-${{ runner.os }}-${{ matrix.godot-version }}.txt"

      - name: Upload addon package checksum
        uses: actions/upload-artifact@v7
        with:
          name: package-sha-${{ runner.os }}-${{ matrix.godot-version }}
          path: package-sha-${{ runner.os }}-${{ matrix.godot-version }}.txt
          if-no-files-found: error
          retention-days: 1

  windows-export:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        godot-version: [4.4.1, 4.7.1]
    name: Windows export (${{ matrix.godot-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false
          include-templates: true

      - name: Build and run Windows release export
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          $packagePath = Join-Path $packageDir "godot-framework.zip"
          python scripts/package_addon.py --output $packagePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_addon_package.py $packagePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/verify_windows_export.ps1 -PackagePath $packagePath -GodotBin (Get-Command godot).Source
          Copy-Item "$packagePath.sha256" "package-sha-${{ runner.os }}-${{ matrix.godot-version }}.txt"

      - name: Upload addon package checksum
        uses: actions/upload-artifact@v7
        with:
          name: package-sha-${{ runner.os }}-${{ matrix.godot-version }}
          path: package-sha-${{ runner.os }}-${{ matrix.godot-version }}.txt
          if-no-files-found: error
          retention-days: 1

  android-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        godot-version: [4.4.1, 4.7.1]
    name: Android export (${{ matrix.godot-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false
          include-templates: true

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and sign Android release APK
        run: |
          set -euo pipefail
          package_dir=$(mktemp -d)
          package_path="$package_dir/godot-framework.zip"
          apk_path="$RUNNER_TEMP/godot-framework-${{ matrix.godot-version }}.apk"
          python3 scripts/package_addon.py --output "$package_path"
          python3 scripts/verify_addon_package.py "$package_path"
          bash tests/verify_android_export.sh "$package_path" "$(command -v godot)" "$JAVA_HOME" "$ANDROID_HOME" "$apk_path"
          test -f "$apk_path"

      - name: Install and run Android release APK
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: python3 tests/verify_android_runtime.py "$RUNNER_TEMP/godot-framework-${{ matrix.godot-version }}.apk" --adb "$ANDROID_HOME/platform-tools/adb" --timeout-seconds 60

  package-reproducibility:
    name: Package reproducibility
    needs: [godot, macos-export, windows-export]
    runs-on: ubuntu-latest
    steps:
      - name: Download addon package checksums
        uses: actions/download-artifact@v8
        with:
          pattern: package-sha-*
          path: package-sha
          merge-multiple: true

      - name: Compare addon package checksums
        run: |
          set -euo pipefail
          mapfile -t checksum_files < <(find package-sha -type f -name '*.txt' | sort)
          test "${#checksum_files[@]}" -eq 6
          : > package-digests.txt
          for checksum_file in "${checksum_files[@]}"; do
            digest=$(awk 'NR == 1 { print $1 }' "$checksum_file")
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf '%s\n' "$digest" >> package-digests.txt
            printf '%s  %s\n' "$digest" "$(basename "$checksum_file")"
          done
          test "$(sort -u package-digests.txt | wc -l)" -eq 1
